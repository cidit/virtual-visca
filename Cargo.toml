[package]
name = "virtual_visca"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-net = "2.0.0"
bevy = { version = "0.19.0", features = ["bevy_feathers", "jpeg"] }
bevy-inspector-egui = "0.37.0"
bevy_asset_loader = "0.27"
clap = { version = "4.6.5", features = ["derive"] }
# clap-port-flag = "0.4.0" # this version is unix only :(
grafton-visca = "1.0.0"
itertools = "0.15.0"
thiserror = "2.0.19"

[lints.clippy]
type_complexity = "allow"
too_many_arguments = "allow"

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3

# [profile.dist]
# inherits = "release"
# lto = "thin"

